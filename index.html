<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAX Smart Link</title>

<style>
body{
  margin:0;
  padding:30px 18px;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;
  background:#f4f5f7;
  color:#111;
}

.card{
  max-width:560px;
  margin:auto;
  background:white;
  padding:24px;
  border-radius:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.07);
}

h1{
  margin:0 0 10px;
}

p{
  color:#62666d;
  line-height:1.45;
}

input{
  width:100%;
  box-sizing:border-box;
  padding:15px;
  border:1px solid #d7d9dd;
  border-radius:14px;
  font-size:16px;
}

a{
  display:block;
  box-sizing:border-box;
  width:100%;
  margin-top:14px;
  padding:16px;
  border-radius:14px;
  text-align:center;
  text-decoration:none;
  font-size:16px;
  font-weight:700;
  background:#111;
  color:white;
}

.secondary{
  background:#e9eaed;
  color:#111;
}
</style>
</head>

<body>

<div class="card">

<h1>MAX Smart Link</h1>

<p>
Тест перехода на профиль или чат MAX.
</p>

<input
  id="url"
  value="https://clck.ru/3QYJwm"
  inputmode="url"
>

<a id="open" href="https://clck.ru/3QYJwm">
Открыть MAX
</a>

<a
  class="secondary"
  id="new"
  href="https://clck.ru/3QYJwm"
  target="_blank"
  rel="noopener"
>
Открыть в новой вкладке
</a>

</div>

<script>
const input = document.getElementById("url");
const open = document.getElementById("open");
const newTab = document.getElementById("new");

function updateLinks(){
  const url = input.value.trim();

  open.href = url;
  newTab.href = url;
}

input.addEventListener("input", updateLinks);
updateLinks();
</script>

</body>
</html>
