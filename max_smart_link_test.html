<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MAX Smart Link — тест</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f4f5f7;color:#111}
  .wrap{max-width:560px;margin:0 auto;padding:24px 18px 40px}
  .card{background:#fff;border-radius:24px;padding:24px;box-shadow:0 8px 30px rgba(0,0,0,.07)}
  h1{font-size:28px;margin:0 0 8px}
  p{color:#62666d;line-height:1.45}
  label{display:block;font-size:14px;font-weight:600;margin:20px 0 8px}
  input{width:100%;padding:15px;border:1px solid #d7d9dd;border-radius:14px;font-size:16px}
  button{width:100%;border:0;border-radius:14px;padding:16px;margin-top:14px;font-size:16px;font-weight:700;background:#111;color:#fff}
  button.secondary{background:#e9eaed;color:#111}
  .result{display:none;margin-top:20px;padding-top:18px;border-top:1px solid #eee}
  .status{padding:14px;border-radius:14px;background:#f2f3f5;margin-top:12px;font-size:14px}
  .small{font-size:13px;color:#777}
  code{word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>MAX Smart Link</h1>
    <p>Тестовый прототип. Вставь ссылку на профиль/чат MAX и проверь, какой сценарий получится на твоём iPhone.</p>

    <label for="url">Ссылка MAX</label>
    <input id="url" value="https://clck.ru/3QYJwm" inputmode="url" autocomplete="off">

    <button id="go">Открыть MAX</button>
    <button id="newtab" class="secondary">Открыть в новой вкладке</button>

    <div id="result" class="result">
      <b>Что определил браузер</b>
      <div id="status" class="status"></div>
      <p class="small">Этот прототип не может принудительно открыть приложение: окончательное решение о переходе принимает iOS/Safari.</p>
    </div>
  </div>
</div>

<script>
const input=document.getElementById('url');
const result=document.getElementById('result');
const status=document.getElementById('status');

function isIOS(){
  return /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
function isAndroid(){ return /Android/i.test(navigator.userAgent); }

function show(){
  result.style.display='block';
  let device = isIOS() ? 'iPhone/iPad' : isAndroid() ? 'Android' : 'другое устройство';
  status.innerHTML =
    '<b>Устройство:</b> '+device+'<br>'+
    '<b>Исходная ссылка:</b> <code>'+escapeHtml(input.value.trim())+'</code>';
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
function openUrl(newTab){
  const u=input.value.trim();
  if(!/^https?:\\/\\//i.test(u)){
    alert('Вставь полную ссылку, начинающуюся с https://');
    return;
  }
  show();
  if(newTab) window.open(u,'_blank','noopener,noreferrer');
  else window.location.href=u;
}
document.getElementById('go').onclick=()=>openUrl(false);
document.getElementById('newtab').onclick=()=>openUrl(true);
</script>
</body>
</html>
